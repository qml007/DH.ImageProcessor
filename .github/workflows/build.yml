name: Electron Release

on:
  push:
    tags:
      - 'v*' # 当推送 v1.0.0 这样的标签时自动触发打包
  workflow_dispatch: # 允许你在网页上手动点击按钮触发打包

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 24 # 根据你的项目需求调整版本号
          cache: 'npm'

      - name: 安装项目依赖
        run: npm ci

      - name: 编译渲染进程
        run: npm run build

      - name: 使用 electron-builder 打包多格式安装包
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux appimage deb rpm --publish=never    # -w 生成 Windows 安装包，但需要安装wine,所以此处要注释掉 -w, -l 生成 Linux 安装包

      - name: 上传制品 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm