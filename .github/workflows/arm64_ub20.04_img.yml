name: Build_arm64_ub20.04_img

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:bullseye
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Asia/Shanghai
    steps:
      - name: 安装基础依赖
        run: |
          apt-get update
          apt-get install -y \
            curl \
            git \
            ca-certificates \
            build-essential \
            python3 \
            pkg-config \
            libssl-dev \
            libx11-dev \
            libxkbfile-dev \
            libsecret-1-dev \
            libgbm-dev \
            libnss3 \
            libasound2
          apt-get clean

      - name: 安装 Node.js 22
        run: |
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs
          node -v
          npm -v

      - name: 校验环境
        run: |
          echo "=== 架构 ==="
          uname -m
          echo "=== GLIBC ==="
          ldd --version | head -1

      - uses: actions/checkout@v4

      - name: 配置镜像源
        run: |
          npm config set registry https://registry.npmmirror.com
          echo "npm_config_disturl=https://npmmirror.com/mirrors/node" >> $GITHUB_ENV
          echo "npm_config_python=/usr/bin/python3" >> $GITHUB_ENV
          echo "ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/" >> $GITHUB_ENV
          echo "ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/" >> $GITHUB_ENV

      - name: 安装依赖
        run: npm install

      - name: 校验原生模块
        run: |
          echo "=== 检查架构 ==="
          find node_modules -name "*.node" | head -5 | while read f; do
            echo "$f: $(file -b "$f" | cut -d, -f2)"
          done
          echo "=== 检查 GLIBC ==="
          find node_modules -name "*.node" -exec ldd {} \; 2>/dev/null | \
            grep -o "GLIBC_2\.[0-9]*" | sort -uV | tail -5

      - name: 构建
        run: npm run build

      - name: 打包 deb
        run: npx electron-builder --linux deb --arm64 --publish never

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64
          path: dist/*.deb